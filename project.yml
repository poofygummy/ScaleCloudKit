# ScaleCloudKit xcodegen spec (restored/adapted).
# External package pins are taken from upstream nextcloud/NextcloudKit Package.swift
# (read-only reference clone) to keep the declaration surface maximally compatible
# with the upstream NextcloudKit contract. The actual sources under ScaleCloudKit/Sources
# contain the ScaleCloudKit fork (proxy integration etc.).


name: ScaleCloudKit
settings:
  base:
    DEFINES_MODULE: "YES"
    PRODUCT_NAME: ScaleCloudKit
    PRODUCT_MODULE_NAME: ScaleCloudKit
    PRODUCT_BUNDLE_IDENTIFIER: com.scalecloud.ScaleCloudKit
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "14.0"
targets:
  ScaleCloudKit:
    type: framework
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
    settings:
      base:
        DEFINES_MODULE: "YES"
        PRODUCT_NAME: ScaleCloudKit
        PRODUCT_MODULE_NAME: ScaleCloudKit
        PRODUCT_BUNDLE_IDENTIFIER: com.scalecloud.ScaleCloudKit
        SWIFT_VERSION: "5.0"        
    dependencies:
      - framework: ../ScaleCloudGo/prebuilt/ScaleCloudGo.xcframework
        embed: false
      - framework: ../ScaleCloudDeps/prebuilt/Alamofire.xcframework
        embed: false
      - framework: ../ScaleCloudDeps/prebuilt/SwiftyJSON.xcframework
        embed: false
      - framework: ../ScaleCloudDeps/prebuilt/SwiftyXMLParser.xcframework
        embed: false
